<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>習慣トラッカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#f4efe3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#211e19" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="習慣トラッカー">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --paper: #f4efe3;
    --paper-line: rgba(44,42,37,0.07);
    --ink: #2c2a25;
    --ink-soft: #77705f;
    --ink-faint: #a89f8b;
    --hanko: #a3242a;
    --hanko-soft: rgba(163,36,42,0.13);
    --hanko-ghost: rgba(163,36,42,0.06);
    --gold: #a3720f;
    --gold-soft: rgba(163,114,15,0.15);
    --border: rgba(44,42,37,0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #211e19;
      --paper-line: rgba(236,230,216,0.07);
      --ink: #ece6d8;
      --ink-soft: #b3ab98;
      --ink-faint: #756d5c;
      --hanko: #e2574c;
      --hanko-soft: rgba(226,87,76,0.20);
      --hanko-ghost: rgba(226,87,76,0.09);
      --gold: #d9a63e;
      --gold-soft: rgba(217,166,62,0.20);
      --border: rgba(236,230,216,0.16);
    }
  }
  :root[data-theme="dark"] {
    --paper: #211e19;
    --paper-line: rgba(236,230,216,0.07);
    --ink: #ece6d8;
    --ink-soft: #b3ab98;
    --ink-faint: #756d5c;
    --hanko: #e2574c;
    --hanko-soft: rgba(226,87,76,0.20);
    --hanko-ghost: rgba(226,87,76,0.09);
    --gold: #d9a63e;
    --gold-soft: rgba(217,166,62,0.20);
    --border: rgba(236,230,216,0.16);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      repeating-linear-gradient(var(--paper-line) 0 1px, transparent 1px 28px),
      var(--paper);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    padding: 40px 18px 80px;
  }

  .page { max-width: 620px; margin: 0 auto; }

  header { margin-bottom: 28px; }
  h1 {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: 30px;
    margin: 0 0 6px;
    letter-spacing: 0.02em;
  }
  .today {
    color: var(--ink-soft);
    font-size: 14px;
    letter-spacing: 0.04em;
  }

  .summary {
    margin-top: 18px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .summary strong { color: var(--ink); font-size: 15px; }
  .summary .bar {
    flex: 1;
    height: 1px;
    background: var(--border);
    position: relative;
    top: 1px;
  }
  .summary .bar > span {
    display: block;
    height: 2px;
    background: var(--hanko);
    top: -1.5px;
    position: relative;
    transition: width 0.4s ease;
  }

  .stats-band {
    margin-top: 22px;
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
  }
  .stat-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .stat-block .stat-num {
    font-family: 'Shippori Mincho', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--hanko);
    line-height: 1;
  }
  .stat-block .stat-num .unit {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-left: 2px;
  }
  .stat-block .stat-label {
    font-size: 11.5px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }
  .motivation-msg {
    margin-top: 12px;
    font-size: 13px;
    color: var(--ink);
    background: var(--hanko-ghost);
    border-left: 2px solid var(--hanko);
    padding: 8px 12px;
    border-radius: 0 4px 4px 0;
  }

  .week-chart-section {
    margin: 32px 0 30px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
  }
  .week-chart-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .week-chart-sub {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }
  .week-chart {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    height: 120px;
    padding: 0 2px;
  }
  .week-bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
    min-width: 0;
  }
  .week-bar-pct {
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-bottom: 4px;
    white-space: nowrap;
  }
  .week-bar-col.current .week-bar-pct {
    color: var(--hanko);
    font-weight: 700;
  }
  .week-bar-track {
    width: 100%;
    max-width: 28px;
    flex: 1;
    display: flex;
    align-items: flex-end;
    background: var(--paper-line);
    border-radius: 3px 3px 0 0;
    overflow: hidden;
  }
  .week-bar-fill {
    width: 100%;
    background: var(--ink-faint);
    transition: height 0.5s ease;
  }
  .week-bar-col.current .week-bar-fill { background: var(--hanko); }
  .week-bar-col.milestone .week-bar-fill { background: var(--gold); }
  .week-bar-label {
    margin-top: 6px;
    font-size: 10px;
    color: var(--ink-faint);
    white-space: nowrap;
  }
  .week-bar-col.current .week-bar-label { color: var(--ink); font-weight: 700; }
  .week-bar-empty {
    font-size: 11px;
    color: var(--ink-faint);
    padding: 30px 0;
    text-align: center;
    width: 100%;
  }

  .add-form {
    display: flex;
    gap: 10px;
    margin: 30px 0 26px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }
  .add-form input {
    flex: 1;
    border: none;
    background: transparent;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    padding: 6px 2px;
    outline: none;
  }
  .add-form input::placeholder { color: var(--ink-faint); }
  .add-form button {
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    padding: 7px 16px;
    cursor: pointer;
    border-radius: 999px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .add-form select,
  .add-form input[type="number"] {
    border: none;
    border-bottom: 1px solid var(--border);
    background: transparent;
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    padding: 5px 4px;
    outline: none;
  }
  .add-form input[type="number"] {
    width: 46px;
    text-align: center;
  }
  .add-form .freq-unit {
    font-size: 13px;
    color: var(--ink-soft);
    margin-right: 2px;
  }
  .add-form .freq-unit[hidden] { display: none; }
  .add-form button:hover { background: var(--ink); color: var(--paper); }

  .habit-list { display: flex; flex-direction: column; }

  .habit-row {
    display: grid;
    grid-template-columns: 46px 1fr auto;
    gap: 16px;
    align-items: center;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }
  .habit-row:first-child { border-top: 1px solid var(--border); }

  .stamp-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1.6px solid var(--ink-faint);
    background: transparent;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .stamp-btn:active { transform: scale(0.94); }
  .stamp-btn.done {
    border-color: var(--hanko);
    background: var(--hanko-ghost);
  }
  .stamp-btn.done::before,
  .stamp-btn.done::after {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1.6px solid var(--hanko);
    border-radius: 50%;
  }
  .stamp-btn.done::after {
    inset: 13px;
    border-width: 0;
    background: var(--hanko);
    opacity: 0.85;
  }
  .stamp-btn.pop { animation: stampPop 0.45s ease; }
  @keyframes stampPop {
    0% { transform: scale(0.55) rotate(-8deg); }
    55% { transform: scale(1.2) rotate(3deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .habit-body { min-width: 0; }
  .habit-name {
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .habit-meta {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .habit-meta .streak-num { color: var(--hanko); font-weight: 700; }
  .habit-meta .streak-num.milestone { color: var(--gold); }
  .habit-meta .achieved-tag { color: var(--gold); font-weight: 700; }
  .habit-meta .mini-bar {
    display: inline-block;
    width: 60px;
    height: 4px;
    background: var(--paper-line);
    border-radius: 2px;
    overflow: hidden;
    margin-left: 8px;
    vertical-align: middle;
  }
  .habit-meta .mini-bar > span {
    display: block;
    height: 100%;
    background: var(--hanko);
  }
  .freq-tag {
    display: inline-block;
    margin-left: 8px;
    font-size: 10.5px;
    font-weight: 500;
    color: var(--ink-soft);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 8px;
    vertical-align: middle;
  }

  .day-grid {
    display: grid;
    grid-template-columns: repeat(7, 9px);
    grid-auto-rows: 9px;
    gap: 3px;
  }
  .day-grid .cell {
    width: 9px;
    height: 9px;
    border-radius: 2px;
    background: var(--paper-line);
    border: 1px solid var(--border);
  }
  .day-grid .cell.done {
    background: var(--hanko);
    border-color: var(--hanko);
  }
  .day-grid .cell.today {
    outline: 1px solid var(--ink-soft);
    outline-offset: 1px;
  }

  .row-actions {
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
  }
  .delete-btn {
    border: none;
    background: transparent;
    color: var(--ink-faint);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 999px;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .delete-btn:hover { color: var(--hanko); }
  .delete-btn.confirm {
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    background: var(--hanko);
    padding: 6px 12px;
  }
  .delete-btn.confirm:hover { color: #fff; background: var(--hanko); opacity: 0.9; }

  .empty {
    color: var(--ink-soft);
    font-size: 14px;
    padding: 30px 0;
    text-align: center;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  footer {
    margin-top: 34px;
    font-size: 11.5px;
    color: var(--ink-faint);
    text-align: center;
  }

  .backup { margin-top: 14px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .backup button {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 11.5px;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  @media (max-width: 420px) {
    .habit-row { grid-template-columns: 40px 1fr auto; gap: 10px; }
    .day-grid { grid-template-columns: repeat(7, 8px); grid-auto-rows: 8px; }
    .day-grid .cell { width: 8px; height: 8px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>習慣トラッカー</h1>
    <div class="today" id="todayLabel"></div>
    <div class="summary" id="summary" hidden>
      <strong id="summaryCount"></strong>
      <span id="summaryText"></span>
      <span class="bar"><span id="summaryBar" style="width:0%"></span></span>
    </div>
    <div class="stats-band" id="statsBand" hidden>
      <div class="stat-block">
        <div class="stat-num" id="statStreak">0<span class="unit">日</span></div>
        <div class="stat-label">最長連続記録</div>
      </div>
      <div class="stat-block">
        <div class="stat-num" id="statWeekStamps">0<span class="unit">回</span></div>
        <div class="stat-label">今週のスタンプ</div>
      </div>
      <div class="stat-block">
        <div class="stat-num" id="statWeekRate">0<span class="unit">%</span></div>
        <div class="stat-label">今週の達成率</div>
      </div>
    </div>
    <div class="motivation-msg" id="motivationMsg" hidden></div>
  </header>

  <div class="week-chart-section" id="weekChartSection" hidden>
    <div class="week-chart-title">週間達成率</div>
    <div class="week-chart-sub">直近8週間の達成率（登録している習慣に対する実績の割合）</div>
    <div class="week-chart" id="weekChart"></div>
  </div>

  <div class="add-form" id="addForm">
    <input id="habitInput" type="text" placeholder="新しい習慣を入力（例：ストレッチ、読書）" maxlength="40" autocomplete="off" />
    <select id="freqType">
      <option value="daily">毎日</option>
      <option value="weekly">週に</option>
      <option value="monthly">月に</option>
    </select>
    <input id="freqCount" type="number" min="1" max="7" value="3" style="display:none" />
    <span id="freqUnit" class="freq-unit" hidden>回</span>
    <button type="button" id="addBtn">追加</button>
  </div>

  <div class="habit-list" id="habitList"></div>
  <div class="empty" id="emptyState" hidden>まだ習慣がありません。上の欄から追加してみましょう。</div>

  <footer>丸を押すと今日の分にスタンプが押されます。右の点はここ35日間の記録です。<div class="backup"><button type="button" id="backupCopy">記録をコピー（バックアップ）</button><button type="button" id="backupRestore">コピーした記録を復元</button></div></footer>
</div>

<script>
(function () {
  const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];

  let state = { habits: [], logs: {} };
  let pendingDeleteId = null;
  let pendingDeleteTimer = null;

  function pad2(n) { return String(n).padStart(2, '0'); }

  function fmtDate(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function dateStrOffset(offsetDays) {
    const d = new Date();
    d.setDate(d.getDate() + offsetDays);
    return fmtDate(d);
  }

  function todayStr() { return dateStrOffset(0); }

  function isDone(habitId, offsetDays) {
    const day = dateStrOffset(offsetDays);
    return !!(state.logs[day] && state.logs[day][habitId]);
  }

  function currentStreak(habitId) {
    let offset = 0;
    if (!isDone(habitId, 0)) {
      if (!isDone(habitId, -1)) return 0;
      offset = -1;
    }
    let count = 0;
    while (isDone(habitId, offset)) {
      count++;
      offset--;
    }
    return count;
  }

  function startOfWeekMonday(d) {
    const day = d.getDay();
    const diff = (day === 0 ? -6 : 1) - day;
    const monday = new Date(d);
    monday.setHours(0, 0, 0, 0);
    monday.setDate(d.getDate() + diff);
    return monday;
  }

  function countInRange(habitId, startDate, endDate) {
    let count = 0;
    const cur = new Date(startDate);
    cur.setHours(0, 0, 0, 0);
    const end = new Date(endDate);
    end.setHours(0, 0, 0, 0);
    while (cur <= end) {
      const str = fmtDate(cur);
      if (state.logs[str] && state.logs[str][habitId]) count++;
      cur.setDate(cur.getDate() + 1);
    }
    return count;
  }

  function weeklyProgress(habitId) {
    const today = new Date();
    return countInRange(habitId, startOfWeekMonday(today), today);
  }

  function monthlyProgress(habitId) {
    const today = new Date();
    const first = new Date(today.getFullYear(), today.getMonth(), 1);
    return countInRange(habitId, first, today);
  }

  function weekRangeForOffset(offsetWeeks) {
    const today = new Date();
    const thisMonday = startOfWeekMonday(today);
    const start = new Date(thisMonday);
    start.setDate(thisMonday.getDate() - offsetWeeks * 7);
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    return { start, end };
  }

  function computeWeeklyRate(offsetWeeks) {
    const { start, end } = weekRangeForOffset(offsetWeeks);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const rangeEnd = end < today ? end : today;
    if (rangeEnd < start) return null;

    let actual = 0;
    let expected = 0;
    for (const h of state.habits) {
      const createdAt = h.createdAt || fmtDate(start);
      if (createdAt > fmtDate(rangeEnd)) continue;
      const habitStart = createdAt > fmtDate(start) ? new Date(createdAt) : start;
      if (h.freqType === 'weekly' || h.freqType === 'monthly') {
        const target = h.freqType === 'weekly' ? (h.freqCount || 1) : (h.freqCount || 1) / 4.345;
        expected += target;
        actual += countInRange(h.id, start, end);
      } else {
        const days = Math.round((rangeEnd - habitStart) / 86400000) + 1;
        if (days <= 0) continue;
        expected += days;
        actual += countInRange(h.id, habitStart, rangeEnd);
      }
    }
    if (expected === 0) return null;
    return Math.max(0, Math.min(100, (actual / expected) * 100));
  }

  function bestCurrentStreak() {
    let best = 0;
    for (const h of state.habits) {
      if ((h.freqType || 'daily') !== 'daily') continue;
      const s = currentStreak(h.id);
      if (s > best) best = s;
    }
    return best;
  }

  function thisWeekStampCount() {
    const today = new Date();
    const monday = startOfWeekMonday(today);
    let count = 0;
    for (const h of state.habits) count += countInRange(h.id, monday, today);
    return count;
  }

  function loadLocal() {
    try {
      const raw = localStorage.getItem('habit-tracker-state');
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') {
          state = { habits: parsed.habits || [], logs: parsed.logs || {} };
        }
      }
    } catch (e) { /* ignore */ }
  }

  function saveLocal() {
    try {
      localStorage.setItem('habit-tracker-state', JSON.stringify(state));
    } catch (e) { /* ignore */ }
  }

  function persist() {
    saveLocal();
  }

  function mutate(fn) {
    fn(state);
    render();
    persist();
  }

  function addHabit(name, freqType, freqCount) {
    const trimmed = name.trim();
    if (!trimmed) return;
    const id = 'h_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    const type = (freqType === 'weekly' || freqType === 'monthly') ? freqType : 'daily';
    const habit = { id, name: trimmed, createdAt: todayStr(), freqType: type };
    if (type !== 'daily') {
      let count = parseInt(freqCount, 10);
      if (!count || count < 1) count = 1;
      const max = type === 'weekly' ? 7 : 31;
      if (count > max) count = max;
      habit.freqCount = count;
    }
    mutate((s) => {
      s.habits.push(habit);
    });
  }

  function toggleToday(habitId) {
    const willTurnOn = !isDone(habitId, 0);
    mutate((s) => {
      const t = todayStr();
      if (!s.logs[t]) s.logs[t] = {};
      if (s.logs[t][habitId]) {
        delete s.logs[t][habitId];
      } else {
        s.logs[t][habitId] = true;
      }
    });
    if (willTurnOn) {
      requestAnimationFrame(() => {
        const btn = document.querySelector('.habit-row[data-id="' + habitId + '"] .stamp-btn');
        if (btn) {
          btn.classList.add('pop');
          setTimeout(() => btn.classList.remove('pop'), 500);
        }
      });
    }
  }

  function deleteHabit(habitId) {
    mutate((s) => {
      s.habits = s.habits.filter((h) => h.id !== habitId);
      for (const day in s.logs) {
        if (s.logs[day] && s.logs[day][habitId]) delete s.logs[day][habitId];
      }
    });
  }

  function requestDeleteConfirm(habitId) {
    pendingDeleteId = habitId;
    if (pendingDeleteTimer) clearTimeout(pendingDeleteTimer);
    pendingDeleteTimer = setTimeout(() => {
      pendingDeleteId = null;
      pendingDeleteTimer = null;
      render();
    }, 3000);
    render();
  }

  function clearDeleteConfirm() {
    pendingDeleteId = null;
    if (pendingDeleteTimer) {
      clearTimeout(pendingDeleteTimer);
      pendingDeleteTimer = null;
    }
  }

  function renderTodayLabel() {
    const d = new Date();
    const label = d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日（' + WEEKDAYS[d.getDay()] + '）';
    document.getElementById('todayLabel').textContent = label;
  }

  function renderSummary() {
    const el = document.getElementById('summary');
    const total = state.habits.length;
    if (total === 0) { el.hidden = true; return; }
    el.hidden = false;
    let done = 0;
    for (const h of state.habits) if (isDone(h.id, 0)) done++;
    document.getElementById('summaryCount').textContent = done + ' / ' + total;
    document.getElementById('summaryText').textContent = '今日完了';
    document.getElementById('summaryBar').style.width = (total ? (done / total) * 100 : 0) + '%';
  }

  function renderStatsBand() {
    const band = document.getElementById('statsBand');
    const msgEl = document.getElementById('motivationMsg');
    if (state.habits.length === 0) { band.hidden = true; msgEl.hidden = true; return; }
    band.hidden = false;

    const streak = bestCurrentStreak();
    const weekStamps = thisWeekStampCount();
    const weekRate = computeWeeklyRate(0);
    const rateVal = weekRate === null ? 0 : Math.round(weekRate);

    document.getElementById('statStreak').innerHTML = streak + '<span class="unit">日</span>';
    document.getElementById('statWeekStamps').innerHTML = weekStamps + '<span class="unit">回</span>';
    document.getElementById('statWeekRate').innerHTML = rateVal + '<span class="unit">%</span>';

    let msg = '';
    if (weekRate === null) {
      msg = '';
    } else if (rateVal >= 90) {
      msg = '絶好調です。今週はほぼ完璧なペースです。';
    } else if (rateVal >= 70) {
      msg = 'いい調子です。この波に乗っていきましょう。';
    } else if (rateVal >= 40) {
      msg = '少しずつ積み上がっています。今日の一押しが次につながります。';
    } else {
      msg = '今週はまだこれから。まずは今日ひとつだけ押してみましょう。';
    }
    if (msg) { msgEl.hidden = false; msgEl.textContent = msg; } else { msgEl.hidden = true; }
  }

  function renderWeekChart() {
    const section = document.getElementById('weekChartSection');
    const chart = document.getElementById('weekChart');
    if (state.habits.length === 0) { section.hidden = true; return; }
    section.hidden = false;

    const weeks = [];
    for (let offset = 7; offset >= 0; offset--) {
      const { start, end } = weekRangeForOffset(offset);
      const rate = computeWeeklyRate(offset);
      weeks.push({ start, end, rate, isCurrent: offset === 0 });
    }

    if (weeks.every((w) => w.rate === null)) {
      chart.innerHTML = '<div class="week-bar-empty">記録がたまるとここに表示されます</div>';
      return;
    }

    chart.innerHTML = weeks.map((w) => {
      const pct = w.rate === null ? 0 : Math.round(w.rate);
      const label = (w.start.getMonth() + 1) + '/' + w.start.getDate();
      const colClasses = 'week-bar-col' + (w.isCurrent ? ' current' : '') + (pct >= 100 ? ' milestone' : '');
      const pctText = w.rate === null ? '-' : pct + '%';
      return (
        '<div class="' + colClasses + '">' +
          '<div class="week-bar-pct">' + pctText + '</div>' +
          '<div class="week-bar-track"><div class="week-bar-fill" style="height:' + pct + '%"></div></div>' +
          '<div class="week-bar-label">' + label + '</div>' +
        '</div>'
      );
    }).join('');
  }

  function buildDayGrid(habitId) {
    const days = [];
    for (let i = 34; i >= 0; i--) days.push(i === 0 ? 0 : -i);
    // oldest (-34) first, today (0) last
    const ordered = [];
    for (let i = -34; i <= 0; i++) ordered.push(i);
    let html = '';
    for (const offset of ordered) {
      const done = isDone(habitId, offset);
      const cls = 'cell' + (done ? ' done' : '') + (offset === 0 ? ' today' : '');
      html += '<div class="' + cls + '"></div>';
    }
    return html;
  }

  function render() {
    renderTodayLabel();
    renderSummary();
    renderStatsBand();
    renderWeekChart();

    const list = document.getElementById('habitList');
    const empty = document.getElementById('emptyState');

    if (state.habits.length === 0) {
      list.innerHTML = '';
      empty.hidden = false;
      return;
    }
    empty.hidden = true;

    list.innerHTML = state.habits.map((h) => {
      const done = isDone(h.id, 0);
      const freqType = h.freqType || 'daily';
      let metaHtml = '';
      let tagText = '毎日';

      if (freqType === 'daily') {
        const streak = currentStreak(h.id);
        const streakCls = 'streak-num' + (streak >= 7 ? ' milestone' : '');
        metaHtml = streak > 0
          ? '<span class="' + streakCls + '">' + streak + '日</span> 連続'
          : 'まだ連続記録なし';
      } else {
        const target = h.freqCount || 1;
        const progress = freqType === 'weekly' ? weeklyProgress(h.id) : monthlyProgress(h.id);
        const periodLabel = freqType === 'weekly' ? '今週' : '今月';
        tagText = (freqType === 'weekly' ? '週' : '月') + 'に' + target + '回';
        const achieved = progress >= target;
        const pct = Math.min(100, (progress / target) * 100);
        const streakCls = 'streak-num' + (achieved ? ' milestone' : '');
        metaHtml =
          periodLabel + ' <span class="' + streakCls + '">' + progress + '</span> / ' + target + '回' +
          (achieved ? ' <span class="achieved-tag">・達成</span>' : '') +
          '<span class="mini-bar"><span style="width:' + pct + '%"></span></span>';
      }

      const isPendingDelete = pendingDeleteId === h.id;
      const deleteBtnHtml = isPendingDelete
        ? '<button class="delete-btn confirm" data-action="delete" aria-label="本当に削除しますか、もう一度押すと削除します">本当に削除</button>'
        : '<button class="delete-btn" data-action="delete" aria-label="削除">×</button>';

      return (
        '<div class="habit-row" data-id="' + h.id + '">' +
          '<button class="stamp-btn' + (done ? ' done' : '') + '" data-action="toggle" aria-pressed="' + done + '" aria-label="' + h.name + 'を今日達成"></button>' +
          '<div class="habit-body">' +
            '<div class="habit-name">' + escapeHtml(h.name) + '<span class="freq-tag">' + tagText + '</span></div>' +
            '<div class="habit-meta">' + metaHtml + '</div>' +
            '<div class="day-grid">' + buildDayGrid(h.id) + '</div>' +
          '</div>' +
          '<div class="row-actions">' + deleteBtnHtml + '</div>' +
        '</div>'
      );
    }).join('');
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  document.getElementById('habitList').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const row = e.target.closest('.habit-row');
    const id = row && row.getAttribute('data-id');
    if (!id) return;
    if (btn.dataset.action === 'toggle') {
      if (pendingDeleteId) clearDeleteConfirm();
      toggleToday(id);
    }
    if (btn.dataset.action === 'delete') {
      if (pendingDeleteId === id) {
        clearDeleteConfirm();
        deleteHabit(id);
      } else {
        requestDeleteConfirm(id);
      }
    }
  });

  function submitNewHabit() {
    const input = document.getElementById('habitInput');
    const freqTypeSel = document.getElementById('freqType');
    const freqCountInput = document.getElementById('freqCount');
    addHabit(input.value, freqTypeSel.value, freqCountInput.value);
    input.value = '';
    input.focus();
  }

  document.getElementById('addBtn').addEventListener('click', submitNewHabit);
  document.getElementById('habitInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      submitNewHabit();
    }
  });

  document.getElementById('freqType').addEventListener('change', (e) => {
    const countInput = document.getElementById('freqCount');
    const unit = document.getElementById('freqUnit');
    if (e.target.value === 'daily') {
      countInput.style.display = 'none';
      unit.hidden = true;
    } else {
      countInput.style.display = '';
      countInput.max = e.target.value === 'weekly' ? 7 : 31;
      if (Number(countInput.value) > Number(countInput.max)) countInput.value = countInput.max;
      unit.hidden = false;
    }
  });


  document.getElementById('backupCopy').addEventListener('click', async () => {
    const text = JSON.stringify(state);
    try {
      await navigator.clipboard.writeText(text);
      alert('記録をコピーしました。メモアプリなどに貼り付けて保管してください。');
    } catch (e) {
      window.prompt('この文字列を全選択してコピーし、メモなどに保管してください', text);
    }
  });

  document.getElementById('backupRestore').addEventListener('click', () => {
    const text = window.prompt('コピーしておいた記録を貼り付けてください（現在の記録は置き換わります）');
    if (!text) return;
    try {
      const parsed = JSON.parse(text);
      if (!parsed || !Array.isArray(parsed.habits)) throw new Error('bad');
      state = { habits: parsed.habits, logs: parsed.logs || {} };
      persist();
      render();
      alert('記録を復元しました。');
    } catch (e) {
      alert('復元できませんでした。コピーした文字列をそのまま貼り付けてください。');
    }
  });

  loadLocal();
  render();

})();
</script>
</body>
</html>
